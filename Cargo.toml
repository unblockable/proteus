[package]
name = "proteus"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
asn1 = "0.23.0"
bytes = "1.11.0"
chacha20poly1305 = "0.10.0" # AEAD cipher
clap = { version = "4.5.0", features = ["derive"] }
enum-from = { path = "lib/enum-from" }
env_logger = "0.11.0"
fast-socks5 = "1.0"
futures = "0.3.0"
hex = "0.4.0"
itertools = "0.14.0"
log = "0.4.0"
pem = "3.0"
pest = "2.0"
pest_derive = "2.0"
petgraph = "0.8.0"
rand = "0.9.0"
rand_core = "0.9.0"
salsa20 = "0.10.0" # CPRNG for Nonce generation
sha256 = "1.5.0"
supertunnel = { path = "../supertunnel" }
thiserror = "2.0.0"
tokio = { version = "1.49.0", features = ["macros", "rt", "rt-multi-thread", "io-util", "net", "sync", "time"] }
tokio-util = { version = "0.7.0", features = ["codec", "io"] }
x25519-dalek = { version = "2", features = ["getrandom"] } # ephemeral key exchange
xxhash-rust = { version = "0.8.0", features = ["xxh3"] }

[build-dependencies]
which = "8.0.0"

[dev-dependencies]
test_bin = "0.5.0"
test_each_file = "0.3.0"
tokio-test = "0.4.0"
